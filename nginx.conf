#
# A static-file server for one single-page app. Nothing dynamic, no upstream, no credential.
# Installed as /etc/nginx/conf.d/default.conf in the image, with security-headers.conf beside it
# in /etc/nginx/. The base image runs nginx as an unprivileged user, so it listens on 8080.
#
# Every location includes the security headers itself: a location with its own `add_header`
# inherits none from the server block.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The catalogue is the one file that goes stale, and a cached copy is worse than a slow one: a
    # browser serving an old snapshot from cache would present retired models as available with
    # no indication anything was wrong. The app's own `cache: "no-store"` asks for this too; this
    # makes it true from the server side as well.
    location = /catalogue.json {
        # The deployment mounts the DIRECTORY holding the snapshot at /srv/catalogue (a directory
        # bind mount sees a file replaced by rename; a file-level one keeps the old inode).
        alias /srv/catalogue/catalogue.json;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store, must-revalidate" always;
        default_type application/json;
    }

    # Hashed bundle assets are immutable by construction (the hash changes when content does),
    # so they are safe to cache hard.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # index.html names the hashed assets, so it must be revalidated: a heuristically cached copy
    # would ask a new image for assets it no longer has.
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # SPA fallback. The app has no client-side router, but a direct hit on any other path lands
    # on the app rather than nginx's 404 page.
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # Nothing here is secret, but there is no reason to advertise the exact nginx build.
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
