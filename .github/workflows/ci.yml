#
# ci — calls build.yml; the job id `ci` plus build.yml's job `gate` make the required status
# check `ci / gate`.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/build.yml
