#
# The security headers, included in EVERY location of nginx.conf. nginx does not inherit
# `add_header` from the server block into a location that has an `add_header` of its own, so a
# server-level copy would silently drop these from /catalogue.json and /assets/.
#
# The app renders NO user input and loads no third-party script: every asset is same-origin from
# the bundle, so the policy can be strict. 'unsafe-inline' is present for style-src ONLY (the React
# build injects inline style attributes); script-src stays 'self'.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
